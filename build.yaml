# This file generates the GitHub Actions matrix.
# One pair of entries per physical keyboard. All keyboards share the same
# keymap (config/cradio.keymap); the BLE address is derived from each chip's
# factory-programmed ID, so boards never conflict on address. What you must
# differentiate is the advertised NAME (CONFIG_ZMK_KEYBOARD_NAME) - otherwise
# pairing becomes ambiguous (e.g. Windows refuses a second device with an
# identical name).
#
# The default name lives in ONE place: config/cradio.conf
# (CONFIG_ZMK_KEYBOARD_NAME). Only a SECOND physical keyboard needs an
# override here. Add a pair of entries per extra keyboard, e.g.:
#   - board: nice_nano@2//zmk
#     shield: cradio_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME="blackcradio-<place>"
#     artifact-name: blackcradio-<place>_left
#   - board: nice_nano@2//zmk
#     shield: cradio_right
#     cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="blackcradio-<place>"
#     artifact-name: blackcradio-<place>_right
---
include:
  # Default keyboard: name comes from config/cradio.conf ("blackcradio").
  - board: nice_nano@2//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    artifact-name: blackcradio_left
  - board: nice_nano@2//zmk
    shield: cradio_right
    artifact-name: blackcradio_right

  # Second keyboard: needs its own name to avoid ambiguous pairing.
  - board: nice_nano@2//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME='\"whitecradio\"'"
    artifact-name: whitecradio_left
  - board: nice_nano@2//zmk
    shield: cradio_right
    cmake-args: "-DCONFIG_ZMK_KEYBOARD_NAME='\"whitecradio\"'"
    artifact-name: whitecradio_right
