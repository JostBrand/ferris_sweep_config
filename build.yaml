# This file generates the GitHub Actions matrix.
# One pair of entries per physical keyboard. All keyboards share the same
# keymap (config/cradio.keymap); the BLE address is derived from each chip's
# factory-programmed ID, so boards never conflict on address. What you must
# differentiate is the advertised NAME (CONFIG_ZMK_KEYBOARD_NAME) - otherwise
# pairing becomes ambiguous (e.g. Windows refuses a second device with an
# identical name).
#
# Add a new pair of entries per keyboard, e.g.:
#   - board: nice_nano@2//zmk
#     shield: cradio_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME="bigfoot-<place>"
#     artifact-name: bigfoot-<place>_left
#   - board: nice_nano@2//zmk
#     shield: cradio_right
#     cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="bigfoot-<place>"
#     artifact-name: bigfoot-<place>_right
---
include:
  - board: nice_nano@2//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME=\"bigfoot\""
    artifact-name: bigfoot_left
  - board: nice_nano@2//zmk
    shield: cradio_right
    cmake-args: "-DCONFIG_ZMK_KEYBOARD_NAME=\"bigfoot\""
    artifact-name: bigfoot_right

  - board: nice_nano@2//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME=\"bigfoot-work\""
    artifact-name: bigfoot-work_left
  - board: nice_nano@2//zmk
    shield: cradio_right
    cmake-args: "-DCONFIG_ZMK_KEYBOARD_NAME=\"bigfoot-work\""
    artifact-name: bigfoot-work_right
